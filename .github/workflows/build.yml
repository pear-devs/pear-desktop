name: Build Pear Desktop

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: "24.x"

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.release.outputs.version_tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - id: release
        name: Check whether release is needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="v$(node -pe "require('./package.json').version")"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION_TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    needs: prepare
    name: Build Pear Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26, ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        if: startsWith(matrix.os, 'macOS') != true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup NodeJS for macOS
        if: startsWith(matrix.os, 'macOS')
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron tests launch compiled main process from dist/.
      - name: Vite Build
        run: |
          pnpm build

      # Release builds run only from this repository's master branch.
      - name: Build release assets on Mac
        if: needs.prepare.outputs.should_publish == 'true' && startsWith(matrix.os, 'macOS')
        run: |
          pnpm electron-builder --mac -p never

      - name: Build release assets on Linux
        if: needs.prepare.outputs.should_publish == 'true' && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo snap install snapcraft --classic
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/x86_64/24.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/x86_64/24.08
          pnpm electron-builder --linux -p never

      - name: Build release assets on Windows
        if: needs.prepare.outputs.should_publish == 'true' && startsWith(matrix.os, 'windows')
        run: |
          pnpm electron-builder --win -p never

      - name: Upload release assets
        if: needs.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 1
          path: |
            pack/*.AppImage
            pack/*.deb
            pack/*.dmg
            pack/*.dmg.blockmap
            pack/*.exe
            pack/*.flatpak
            pack/*.freebsd
            pack/*.nsis.7z
            pack/*.rpm
            pack/*.snap
            pack/*.tar.gz
            pack/*.yml
            pack/nsis-web/*.exe
            pack/nsis-web/*.nsis.7z
            pack/nsis-web/*.yml
            !pack/builder-debug.yml

      - name: Test
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        with:
          run: pnpm test:debug


  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Release Pear Desktop
    if: needs.prepare.outputs.should_publish == 'true'
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        if: startsWith(matrix.os, 'macOS') != true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup NodeJS for macOS
        if: startsWith(matrix.os, 'macOS')
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          cat > release-notes.md <<EOF
          See [changelog](${{ github.server_url }}/${{ github.repository }}/blob/master/changelog.md#$(echo "$VERSION_TAG" | sed -e 's/\.//g')) for the list of updates and the full diff.

          Thanks to all contributors! 🏅

          (Note for Windows: Pear-Desktop-Web-Setup-$VERSION_TAG.exe is an installer, and Pear-Desktop-$VERSION_TAG.exe is a portable version)
          EOF
          if ! gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release create "$VERSION_TAG" --draft --title "$VERSION_TAG" --notes-file release-notes.md
          fi

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          find release-assets -type f -print0 | xargs -0 gh release upload "$VERSION_TAG" --clobber
          gh release edit "$VERSION_TAG" --draft=false

      - name: Update changelog
        run: |
          pnpm changelog

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: Update changelog for ${{ needs.prepare.outputs.version_tag }}
          file_pattern: "changelog.md"
          commit_user_name: CI
          commit_user_email: th-ch@users.noreply.github.com
