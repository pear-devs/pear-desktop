name: reviewdog

on: [pull_request_target]

permissions: {}

env:
  NODE_VERSION: "24" # nub resolves a major, not ranges like 24.x

jobs:
  oxlint:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    name: runner / oxlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup nub and NodeJS
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: 0.9.5
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: nub ci --ignore-scripts

      # Only the PR's sources, linted with the base branch's dependencies and config:
      # nothing from the PR is installed or run (pull_request_target has write access).
      - name: Checkout PR source files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            apps
            packages
            plugins
            scripts
          path: __pr_src

      # The workspaces keep their own node_modules (plugins/<id>/node_modules…), so the
      # PR's files go over them in place (by content: checkouts seconds apart share
      # mtimes): --delete drops files the PR removed, and
      # node_modules is neither copied nor deleted.
      - name: Overlay PR source
        run: |
          for dir in apps packages plugins scripts; do
            rsync -a --checksum --delete --exclude node_modules "__pr_src/$dir/" "$dir/"
          done
          rm -rf __pr_src

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f
        with:
          reviewdog_version: latest

      - name: Run oxlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          nub dlx oxlint apps packages plugins scripts --format=checkstyle |
            reviewdog \
              -f=checkstyle \
              -name=oxlint \
              -reporter=github-pr-review \
              -filter-mode=file \
              -fail-level=error \
              -tee
