# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Reqest, surfacing known-vulnerable versions of the packages declared or updated in the PR. Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: "Dependency Review"
on: [ pull_request ]

permissions:
  contents: read

jobs:
  dependency-review:
    # This action exits 1 when GitHub Dependency graph is disabled. Enable that
    # repository setting, then set Actions variable ENABLE_DEPENDENCY_REVIEW=true.
    # Until then the check is explicitly skipped rather than reported as a false
    # application/CI failure.
    if: github.event.pull_request.draft == false && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: "Dependency Review"
        uses: actions/dependency-review-action@f5b971718edcbb31275a1db40004592335c0e031
